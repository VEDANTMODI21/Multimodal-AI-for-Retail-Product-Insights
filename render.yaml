services:
  - type: web
    name: Multimodal-AI-for-Retail-Product-Insights
    env: python
    branch: main
    buildCommand: python -m pip install --upgrade pip setuptools wheel && python -m pip install -r requirements.txt
    startCommand: gunicorn src.api:app --bind 0.0.0.0:$PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: FREE_DEPLOYMENT
        value: "true"
